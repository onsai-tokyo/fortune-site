<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FATELAB｜ふたりの時系列プレビュー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#141614;background:#f9f8f5;font-size:15px}*{box-sizing:border-box}body{margin:0}header{max-width:1100px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e1dc}header strong{letter-spacing:.23em;font-weight:500}header span,.muted{color:#6c7068;font-size:13px}main{max-width:1100px;margin:auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:64px;padding:40px 24px}h1{font-size:27px;font-weight:500;margin:0 0 12px}h2{font-size:17px;font-weight:500}p{line-height:1.9}aside{align-self:start;position:sticky;top:20px}.intro{margin:0 0 28px;color:#6c7068}label{display:block;font-size:13px;margin-bottom:8px}input,select{font:inherit;color:inherit;border:1px solid #d8d9d1;border-radius:9px;background:white;padding:11px;width:100%;min-width:0}fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:600;margin-bottom:12px}.row{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #deded7;background:white;border-radius:12px;padding:13px 16px;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #658477;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.primary{background:#171b17;color:#fff;border:0;width:100%;border-radius:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button{flex:1;font-size:13px}.helper{font-size:12px;line-height:1.8;color:#6c7068}#message{color:#933c30;line-height:1.8;min-height:1em}.year-card{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:12px;padding:21px 22px;border-radius:16px;margin:0 0 12px;border-color:#e2e1dc;background:#fff}.year-card:hover{border-color:#9daba0}.year-card small{display:block;color:#6c7068;font-size:13px;margin-bottom:12px}.year-card strong{font-weight:500;line-height:1.75;font-size:17px}.arrow{align-self:center;color:#8a8f85}.badge{font-size:11px;color:#647164;background:#edf1e9;padding:4px 7px;border-radius:5px;margin-left:8px}.past{border:1px solid #e1e1d8;border-radius:14px;margin:18px 0;padding:0 16px;background:#efeee9}summary{cursor:pointer;padding:18px 0;font-size:14px;min-height:48px}.group{border-top:1px solid #dddcd3}.group .year-card{padding:18px}.placeholder{border:1px dashed #b4b5ac;padding:20px;border-radius:14px;margin-bottom:12px}#detail{background:#fff;padding:28px;border-radius:18px;border:1px solid #e2e1dc}#detail h1{font-size:23px;line-height:1.7;margin-top:24px}#detail p{line-height:2.15;margin:22px 0;color:#3d3f3a}#detail .eyebrow{color:#6c7068;font-size:13px;margin-top:24px}.hidden,[hidden]{display:none!important}#count{font-size:13px;color:#6c7068;margin:20px 0}footer{font-size:12px;color:#6c7068;line-height:1.8;margin-top:24px}.status{padding:24px;border:1px solid #e2e1dc;border-radius:16px;background:white;line-height:1.9}@media(max-width:760px){main{display:block;padding:28px 20px}aside{position:static;margin-bottom:36px}header{padding:20px}header span{font-size:11px}#detail{padding:20px}.row{grid-template-columns:1.5fr 1fr}}
</style></head><body>
<header><strong>FATELAB</strong><span>確認用プレビュー · 本番反映前</span></header>
<main><aside><h1>ふたりの時系列</h1><p class="intro">出会いから、これからへ。</p>
<form id="inputs"><label for="relationship">確認する組み合わせ</label><select id="relationship"><option value="sample-1">確認用サンプル 1</option><option value="sample-2">確認用サンプル 2</option></select>
<fieldset><legend>あなた</legend><div class="row"><div><label for="date-a">生年月日</label><input id="date-a" type="date" required min="1900-01-01" max="2100-12-31"></div><div><label for="time-a">出生時刻（任意）</label><input id="time-a" type="time"></div></div></fieldset>
<fieldset><legend>相手</legend><div class="row"><div><label for="date-b">生年月日</label><input id="date-b" type="date" required min="1900-01-01" max="2100-12-31"></div><div><label for="time-b">出生時刻（任意）</label><input id="time-b" type="time"></div></div></fieldset>
<label for="meeting">出会った年</label><input id="meeting" type="text" inputmode="numeric" maxlength="4" placeholder="例：2023" aria-describedby="meeting-help">
<p id="meeting-help" class="helper">初めて知り合った年を入力してください。この年から、ふたりの時系列を表示します。</p>
<button class="primary" type="submit" id="generate">保存して表示</button><div class="actions"><button type="button" id="swap">あなたと相手を入れ替え</button><button type="button" id="clear">入力を消去</button></div>
<div id="message" role="alert"></div></form>
<footer>入力は、このブラウザーの組み合わせごとに保存します。本番アカウントには保存されません。<br>初期値の相手は動作確認用の架空データです。</footer></aside>
<section aria-label="年ごとの鑑定"><div id="list"><p class="intro">年と特徴タイトルを選ぶと、詳しい鑑定が開きます。</p><div id="count" aria-live="polite"></div><div id="controls" class="actions" hidden><button id="expand" type="button">すべての年を開く</button><button id="collapse" type="button">過去を折りたたむ</button></div><div id="years"></div></div><article id="detail" hidden tabindex="-1"><button id="back" type="button">← 年の一覧へ</button><div id="detail-year" class="eyebrow"></div><h1 id="detail-title"></h1><div id="paragraphs"></div></article></section>
</main><script src="/app.js"></script></body></html>
