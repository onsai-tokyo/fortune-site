services:
  - type: web
    name: fortune-site-backend
    root: backend
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://fate-lab.com
      - key: FREE_QUESTION_LIMIT
        value: 3
      - key: READING_QUESTION_RATE_LIMIT
        value: 6
      - key: REQUIRE_READING_AUTH
        value: true
      - key: AI_REPORT_ENABLED
        value: true
      # 自己鑑定・相性鑑定は品質ゲート通過済みの決定論エンジンを使用する。
      # AI_REPORT_ENABLED は追加質問チャットと緊急ロールバック用に維持する。
      - key: DETERMINISTIC_SCOPE
        value: all
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
