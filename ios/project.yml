name: FateLab
options:
  bundleIdPrefix: com.onsai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: DB28SG2U7D
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: Fate Lab
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIUserInterfaceStyle: Light
    GENERATE_INFOPLIST_FILE: true
    PRODUCT_BUNDLE_IDENTIFIER: com.onsai.fatelab
    API_BASE_URL: https://fortune-site-iuzo.onrender.com
    # Supabase publishable settings. These values are intentionally public;
    # privileged service-role credentials must never be added to the app.
    SUPABASE_URL: https://jarerymytxcsqvzduqub.supabase.co
    SUPABASE_ANON_KEY: sb_publishable_OqQ-CYxwkGFG82GcBsD7KQ_e0tDkCLk
targets:
  FateLab:
    type: application
    platform: iOS
    sources:
      - path: FateLab
    settings:
      base:
        PRODUCT_NAME: FateLab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FateLab/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.onsai.fatelab.auth
            CFBundleURLSchemes:
              - fatelab
        APIBaseURL: $(API_BASE_URL)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: FateLab/FateLab.entitlements
      properties:
        com.apple.developer.in-app-payments: []
    scheme:
      testTargets: []
